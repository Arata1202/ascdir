name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: Show coverage
        run: |
          go tool cover -func=coverage.out | tail -n 1
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 75) { print "coverage below 75%: " coverage "%"; exit 1 } }'
      - run: go vet ./...
      - name: Validate installer syntax
        run: sh -n install.sh
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
      - name: Validate GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: "1.26.6"
          go-package: ./...
          repo-checkout: false
          cache: false

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary: ascdir
            completion: bash
          - os: macos-latest
            binary: ascdir
            completion: zsh
          - os: windows-latest
            binary: ascdir.exe
            completion: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - run: go test -shuffle=on ./...
      - name: Build executable
        run: go build -o ${{ matrix.binary }} ./cmd/ascdir
      - name: Smoke test executable
        run: |
          ./${{ matrix.binary }} --version
          ./${{ matrix.binary }} help
          ./${{ matrix.binary }} completion ${{ matrix.completion }}
      - name: Validate Bash completion
        if: matrix.completion == 'bash'
        run: ./${{ matrix.binary }} completion bash | bash -n
      - name: Validate Zsh completion
        if: matrix.completion == 'zsh'
        run: ./${{ matrix.binary }} completion zsh > completion.zsh && zsh -n completion.zsh
      - name: Validate PowerShell completion
        if: matrix.completion == 'powershell'
        shell: pwsh
        run: ./${{ matrix.binary }} completion powershell | Out-String | Invoke-Expression

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Install Syft
        shell: bash
        run: |
          set -euo pipefail
          version="1.51.0"
          archive="syft_${version}_linux_amd64.tar.gz"
          base_url="https://github.com/anchore/syft/releases/download/v${version}"
          curl -fsSL "${base_url}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          curl -fsSL "${base_url}/syft_${version}_checksums.txt" -o "${RUNNER_TEMP}/syft-checksums.txt"
          expected="$(awk -v archive="$archive" '$2 == archive { print $1 }' "${RUNNER_TEMP}/syft-checksums.txt")"
          actual="$(sha256sum "${RUNNER_TEMP}/${archive}" | awk '{ print $1 }')"
          test -n "$expected" && test "$actual" = "$expected"
          mkdir -p "${RUNNER_TEMP}/syft"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/syft" syft
          echo "${RUNNER_TEMP}/syft" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
