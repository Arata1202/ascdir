# Exhaustive schema reference. This file contains illustrative values and paths
# and is not intended to be pushed unchanged. Omit optional fields to leave
# their remote values unmanaged; an explicit empty value requests clearing.
version: "2"

app:
  id: "1234567890"
  bundle_id: com.example.app
  platform: IOS
  version: 1.2.0

metadata:
  copyright: "2026 Example, Inc."
  accessibility_url: https://example.com/accessibility
  content_rights_declaration: DOES_NOT_USE_THIRD_PARTY_CONTENT

categories:
  primary_category: PRODUCTIVITY
  # Games and Stickers apps can also manage subcategory IDs:
  # primary_subcategory_one: GAMES_ACTION
  # primary_subcategory_two: GAMES_ADVENTURE
  secondary_category: UTILITIES
  # secondary_subcategory_one: GAMES_ACTION
  # secondary_subcategory_two: GAMES_ADVENTURE

age_rating:
  advertising: false
  alcohol_tobacco_or_drug_use_or_references: NONE
  contests: NONE
  gambling: false
  gambling_simulated: NONE
  guns_or_other_weapons: NONE
  health_or_wellness_topics: false
  # kids_age_band: FIVE_AND_UNDER
  loot_box: false
  medical_or_treatment_information: NONE
  messaging_and_chat: false
  parental_controls: false
  profanity_or_crude_humor: NONE
  age_assurance: false
  sexual_content_graphic_and_nudity: NONE
  sexual_content_or_nudity: NONE
  social_media: false
  social_media_age_restricted: false
  horror_or_fear_themes: NONE
  mature_or_suggestive_themes: NONE
  unrestricted_web_access: false
  user_generated_content: false
  violence_cartoon_or_fantasy: NONE
  violence_realistic_prolonged_graphic_or_sadistic: NONE
  violence_realistic: NONE
  age_rating_override: NONE
  korea_age_rating_override: NONE
  developer_age_rating_info_url: https://example.com/age-rating

accessibility:
  IPHONE:
    published: false
    supports_audio_descriptions: false
    supports_captions: false
    supports_dark_interface: true
    supports_differentiate_without_color_alone: true
    supports_larger_text: true
    supports_reduced_motion: true
    supports_sufficient_contrast: true
    supports_voice_control: false
    supports_voiceover: true

# Omit this section when using Apple's standard EULA.
license_agreement:
  file: metadata/license_agreement.md
  territories:
    - JPN
    - USA

assets:
  screenshots: assets/screenshots
  app_previews: assets/app-previews
  preview_frame_times:
    en-US/IPHONE_67/01-demo.mp4: "00:00:05"

availability:
  available_in_new_territories: false
  territories:
    JPN:
      available: true
      release_date: "2026-09-01"
      pre_order_enabled: false
    USA:
      available: true

# Find valid IDs with `ascdir price-points --territory USA` before uncommenting
# pricing. Keeping the placeholder inactive avoids suggesting it can be pushed.
# pricing:
#   base_territory: USA
#   scheduled_prices:
#     - price_point_id: eyJ...
#       start_date: "2026-09-01"
#       end_date: "2026-12-31"

localizations:
  en-US:
    values:
      name: Example App
      subtitle: A concise app subtitle
      keywords: productivity,example
      support_url: https://example.com/support
      marketing_url: https://example.com
      privacy_policy_url: https://example.com/privacy
      privacy_choices_url: https://example.com/privacy/choices
    files:
      description: metadata/en-US/description.md
      promotional_text: metadata/en-US/promotional_text.md
      whats_new: metadata/en-US/whats_new.md
      # privacy_policy_text: metadata/en-US/privacy_policy.md # TV_OS only
  ja:
    values:
      name: サンプルアプリ
      subtitle: 簡潔なサブタイトル
      keywords: 生産性,サンプル
      support_url: https://example.com/ja/support
      marketing_url: https://example.com/ja
      privacy_policy_url: https://example.com/ja/privacy
      privacy_choices_url: https://example.com/ja/privacy/choices
    files:
      description: metadata/ja/description.md
      promotional_text: metadata/ja/promotional_text.md
      whats_new: metadata/ja/whats_new.md
